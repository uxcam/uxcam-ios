name: Validate distribution repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Manifests and repository size
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Package.swift
        run: swift package dump-package >/dev/null

      - name: Check the package version
        run: |
          package_version="$(sed -n 's/^let version = "\([^"]*\)".*$/\1/p' Package.swift)"
          if ! printf '%s' "$package_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version in Package.swift: '$package_version'"
            exit 1
          fi

      - name: Forbid CocoaPods manifests
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(Podfile(\.lock)?|[^/]+\.podspec(\.json)?)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::UXCam is distributed through Swift Package Manager only; CocoaPods manifests must not be tracked"
            echo "$forbidden"
            exit 1
          fi

      - name: Forbid tracked binary artifacts
        run: |
          forbidden="$(git ls-files | grep -E '\.(a|zip|framework|xcframework)(/|$)' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Binary distribution artifacts must not be tracked"
            echo "$forbidden"
            exit 1
          fi
