name: Validate distribution repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Manifests, tooling, and repository size
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        if: github.event.repository.visibility == 'public'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository
        run: Scripts/validate_repository.sh

      - name: Lint podspec syntax
        run: pod ipc spec UXCam.podspec >/dev/null
